# Bootstrap manifest
# 复制到业务项目 `.harness/project-manifest.yml`，先填写项目名、路径、远端策略和门禁命令。
# Bootstrap 阶段不执行 task queue；确认链路完成后再生成 .harness/task-modeling/task-queue.json。
# 当用户要求按 task queue / harness 流程继续时，本文件是项目任务执行的流程控制源。
# task_queue_auto_commit / require_task_branch / require_pull_request / cmd_git_push / cmd_pr_open
# 构成对 harness 交付流程的用户授权；通用 Agent 工作习惯不得覆盖这些授权。
# git commit / push / PR 创建执行前仍需提示风险并获得明确确认；clean start 不满足时必须停止。

language: node
profile: astro-static-site

code_paths: src,scripts,vitest.config.mjs
test_paths: tests

task_id: "personal-site-t11"
milestone_id: "m1-personal-site"
slice_id: "s11-header-nav-ui"
actor: agent
risk_level: LOW

task_queue_path: .harness/task-modeling/task-queue.json
constraints_path: .harness/constraints.md
lifecycle_state_path: .harness/lifecycle-state.yml
task_queue_auto_approve_max_risk: LOW
task_queue_continue_on_failure: false
task_queue_auto_commit: true
task_queue_auto_commit_on_failure: false
task_queue_auto_commit_require_clean_start: true
task_queue_auto_commit_branch_allowlist: "feature-*,task-*,feature/*,task/*"
task_queue_one_task_per_run: true
task_queue_execution_strategy: batch
task_queue_pr_strategy: end_of_batch
task_queue_batch_max_tasks: 2
task_queue_batch_allowed_max_risk: LOW
task_queue_batch_stop_on_risk: MEDIUM
task_queue_allow_manual_done: true
task_queue_require_execute_hook: false
task_queue_require_commit_on_done: true
require_task_branch: true
protected_branches: "main,master,develop,release/*"
task_branch_prefix: "feature-"
task_branch_require_task_id: false
target_branch: "develop"
require_pull_request: true
require_pr_url: true
pr_evidence_path: .harness/observability/pr-evidence.json
workflow_result_path: .harness/observability/last-workflow-result.json
require_task_evidence: true
task_evidence_paths: "src,tests,docs,public,scripts,package.json,pnpm-lock.yaml,package-lock.json,yarn.lock"
task_evidence_exclude_paths: ".harness/task-modeling,observability,.harness/observability,node_modules,dist,coverage,.playwright-mcp,.DS_Store"

approval_provider: manual
scm_provider: "github"
approval_context: "personal-site"
release_approval_required: false
review_source: ""
required_approver_roles: "reviewer"
approval_record_path: .harness/observability/approval-record.json

review_report_path: docs/review/04-review.md
stage_pr_path: docs/delivery/stage-pr.md
pr_summary_path: docs/delivery/05-pr-summary.md
compliance_report_path: docs/delivery/compliance-report.md
rollback_plan_path: docs/delivery/rollback-plan.md
release_evidence_path: docs/delivery/release-evidence.md

enforce_audit_log_schema: true
audit_log_jsonl_path: .harness/observability/agent-runs.jsonl
audit_log_path: .harness/observability/agent-runs.log
audit_log_schema_path: ../harness-enterprise-template/governance/audit-log.schema.json
audit_summary_path: .harness/observability/audit-summary.md
metrics_json_path: .harness/observability/metrics.json
incident_log_path: .harness/observability/incident-log.md
checkpoints_dir: .harness/observability/checkpoints
progress_board_path: .harness/observability/progress.md
progress_state_path: .harness/observability/progress-state.json

coverage_threshold: 80
strict_mode: true
security_network_fail_open: false

cmd_lint: "pnpm run lint"
cmd_typecheck: "pnpm run typecheck"
cmd_smoke: "pnpm run smoke"
cmd_test: "pnpm run test"
cmd_coverage: "pnpm run coverage"
cmd_e2e: "pnpm run e2e"
cmd_security: ""
cmd_task_execute: ""
cmd_git_push: "git push -u origin $(git branch --show-current)"
cmd_pr_open: "gh pr view --json url --jq .url || gh pr create --base develop --head $(git branch --show-current) --fill"
