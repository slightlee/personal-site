# Harness lifecycle state
# 复制到业务项目 `.harness/lifecycle-state.yml` 后，由人工或 Agent 在每个确认点更新。

project:
  name: "personal-site"
  directory: "personal-site"
  repository_url: "git@github.com:slightlee/personal-site.git"
  repository_strategy: "ssh"
  target_branch: "develop"
  task_branch_prefix: "feature-"

lifecycle:
  current_state: "task_execution_started"
  allowed_next_states:
    - "implementation_ready"

confirmations:
  project_goal:
    status: "confirmed"
    confirmed_by: "user"
    confirmed_at: "2026-05-15"
  prd:
    status: "confirmed"
    document: "docs/requirements/01-prd.md"
    confirmed_by: "user"
    confirmed_at: "2026-05-15"
  technical_design:
    status: "confirmed"
    document: "docs/design/02-design.md"
    confirmed_by: "user"
    confirmed_at: "2026-05-15"
  ui_design:
    required: true
    status: "confirmed"
    document: "docs/design/03-ui-design.md"
    confirmed_by: "user"
    confirmed_at: "2026-05-15"
    skip_reason: ""
  task_breakdown:
    status: "confirmed"
    document: "docs/requirements/02-task-breakdown.md"
    confirmed_by: "user"
    confirmed_at: "2026-05-15"

artifacts:
  manifest: ".harness/project-manifest.yml"
  constraints: ".harness/constraints.md"
  task_queue: "task-modeling/task-queue.json"

baseline:
  push_policy: "required"
  planning_committed: true
  commit_sha: "37b3d7106319299cc6b99fc93ac6249d256e22d0"
  committed_by: "agent"
  committed_at: "2026-05-15"
  planning_pushed: true
  remote: "origin"
  remote_branch: "develop"
  pushed_at: "2026-05-15"
  push_deferred_reason: ""

execution:
  business_code_allowed: true
  dependency_install_allowed: true
  task_queue_allowed: true
  git_commit_allowed: true
  git_push_allowed: true
